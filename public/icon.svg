<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Dark Gradient Background -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>

  <!-- Subtle Blue Outer Accent Ring -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#2563eb" stroke-width="12" opacity="0.6"/>

  <!-- FAMM Initials Monogram -->
  <text 
    x="50%" 
    y="54%" 
    dominant-baseline="middle" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-size="135" 
    letter-spacing="4"
    fill="url(#text-grad)"
  >
    FAMM
  </text>
</svg>
